name: build-image

on:
  push:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC; picks up new opencode releases.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      OPENCODE_VERSION:
        description: opencode version to install (latest or pinned, e.g. v1.18.15)
        required: false
        default: latest

# Queue runs for the same ref instead of racing writes to the mutable tags.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ghisgit/opencode-deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve opencode version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.OPENCODE_VERSION }}
        run: |
          version="${INPUT_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)"
          else
            tag="$version"
            case "$tag" in v*) ;; *) tag="v${tag}";; esac
          fi
          echo "resolved=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # latest + version always; sha- only when the run is tied to a commit.
      # Scheduled runs rebuild the same commit, and rewriting an existing
      # sha- tag would break its "exact commit" guarantee.
      - name: Compute image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${VERSION}"
            if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
              echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if version already published
        id: skip
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.resolve.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENCODE_VERSION=${{ steps.resolve.outputs.resolved }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
