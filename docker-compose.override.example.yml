# Template for docker-compose.override.yml.
# Copy to docker-compose.override.yml and adjust the per-file mounts:
#   cp docker-compose.override.example.yml docker-compose.override.yml
# docker compose auto-merges the override file with docker-compose.yml,
# so the base file stays untouched.
#
# Do NOT mount the whole data/ directory over /data; mount individual files.
# Add one volume line per file.
#
# WARNING: never mount read-only (:ro) files under /data. entrypoint.sh runs
# `chown -R` over /data on every start, so a :ro mount there fails the entrypoint
# and, with `restart: unless-stopped`, causes an infinite restart loop. Keep
# anything mounted under /data writable, and mount read-only files elsewhere
# (e.g. under /etc or /opt).
services:
  opencode:
    # Build locally from ./Dockerfile instead of pulling the prebuilt GHCR
    # image. Comment out `build`/`image` to fall back to the prebuilt image.
    # Build args come from .env (see .env.example).
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
        GH_INSTALL_VERSION: ${GH_INSTALL_VERSION:-false}
        UV_INSTALL_VERSION: ${UV_INSTALL_VERSION:-false}
        FNM_INSTALL_VERSION: ${FNM_INSTALL_VERSION:-false}
        INSTALL_GITHUB_MIRROR: ${INSTALL_GITHUB_MIRROR:-}
        APT_INSTALL_MIRROR: ${APT_INSTALL_MIRROR:-}
        CPP_INSTALL: ${CPP_INSTALL:-false}
    image: opencode:local
    volumes:
      # Writable config under /data (no :ro suffix — required by entrypoint).
      - ./data/.npmrc:/data/.npmrc
      - ./data/.gitconfig:/data/.gitconfig
      # Read-only files: mount outside /data, never under it.
      - ./data/custom.sh:/etc/profile.d/custom.sh:ro

      # Whole-repo bind mount for local development (repo files appear at
      # /workspace/opencode-deploy inside the container).
      - ./:/workspace/opencode-deploy
